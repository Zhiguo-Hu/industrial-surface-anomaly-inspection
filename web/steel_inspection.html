<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>钢材表面检测 · Steel inspection</title>
<style>body{font:16px/1.6 system-ui,sans-serif;color:#172d3c;background:#edf2f5;margin:0}main{max-width:1060px;margin:40px auto;padding:24px}h1{font-size:30px;margin-bottom:0}.sub{color:#637586;margin-top:4px}.card{padding:24px;background:white;border-radius:14px;margin:22px 0;box-shadow:0 3px 15px #1a36460b}button{background:#155a75;color:white;border:0;border-radius:8px;padding:11px 24px;font-size:16px;cursor:pointer}button:disabled{opacity:.5}input{max-width:100%;margin:12px 0 20px}img{width:100%;background:#dce4e9;border-radius:6px}h2{font-size:22px}.muted{color:#637586;font-size:14px}.alarm{color:#b13f22}.ok{color:#217148}a{color:#155a75}#status{white-space:pre-wrap}</style>
<main><h1>钢材表面检测</h1><p class="sub">Steel surface inspection · 本机运行</p>
<div class="card"><strong>上传钢材图像 / Upload a steel image</strong><p class="muted">使用与训练采集条件相近的1600 × 256像素PNG或JPEG原图，最大10MB。请保留原尺度，避免拉伸手机照片。</p>
<input id="file" type="file" accept="image/png,image/jpeg"><br><button id="run" disabled>开始检测 / Inspect</button><p id="status" role="status">正在连接本机模型…</p><p id="acceptance" class="muted"></p></div>
<div class="card" id="result" hidden><h2 id="decision"></h2><p id="timing" class="muted"></p><p>原始图像 / Original</p><img id="original" alt="原始钢材图像"><p>定位响应 / Localization response</p><img id="overlay" alt="缺陷定位响应叠加图"><p class="muted">热力图与掩码仅辅助定位；图像报警与像素边界质量分别验证。</p><a id="mask" download>下载二值掩码 / Download mask</a></div></main>
<script>
const file=document.querySelector('#file'),button=document.querySelector('#run'),status=document.querySelector('#status');
fetch('/health').then(r=>{if(!r.ok)throw Error('模型尚未就绪');return r.json()}).then(v=>{status.textContent='模型已就绪 / Ready';button.disabled=false;document.querySelector('#acceptance').textContent=`独立测试图像报警：召回 ${(v.test_recall*100).toFixed(2)}%，正常误报 ${(v.test_normal_fpr*100).toFixed(2)}%。适用相近的钢材采集条件。`}).catch(e=>status.textContent=e.message);
button.addEventListener('click',async()=>{if(!file.files.length){status.textContent='请先选择图片 / Select an image';return}button.disabled=true;status.textContent='正在检测 / Inspecting…';document.querySelector('#result').hidden=true;
try{const response=await fetch('/predict',{method:'POST',body:file.files[0]});const data=await response.json();if(!response.ok)throw Error(data.error||'检测失败');const decision=document.querySelector('#decision');decision.textContent=data.defect_detected?'检测到异常，建议复核 / Defect detected':'未检出异常 / No defect detected';decision.className=data.defect_detected?'alarm':'ok';document.querySelector('#timing').textContent=`处理耗时 ${data.elapsed_ms.toFixed(0)} ms`;document.querySelector('#original').src=data.input_url;document.querySelector('#overlay').src=data.overlay_url;document.querySelector('#mask').href=data.mask_url;document.querySelector('#result').hidden=false;status.textContent='检测完成 / Complete'}catch(e){status.textContent=e.message}finally{button.disabled=false}});
</script></html>
